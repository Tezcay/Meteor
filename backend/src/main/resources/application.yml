spring:
  application:
    name: meteor-backend
  datasource:
    url: ${METEOR_DB_URL:jdbc:mysql://localhost:3306/meteor?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${METEOR_DB_USERNAME:meteor_app}
    password: ${METEOR_DB_PASSWORD:meteor_dev_only}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${METEOR_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
  sql:
    init:
      mode: never
      encoding: UTF-8
      continue-on-error: false

mybatis:
  mapper-locations: classpath*:mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${METEOR_SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

meteor:
  demo-accounts:
    enabled: ${METEOR_DEMO_ACCOUNTS_ENABLED:false}
  test-payment:
    enabled: ${METEOR_TEST_PAYMENT_ENABLED:false}
